    function renderQuestContent(category) {
      const items = questData[category];
      let html = '<div class="quest-list">';

      items.forEach((item) => {
        let linksHTML = '';
        if (item.links && item.links.length > 0) {
          linksHTML = '<div class="quest-links">';
          item.links.forEach(link => {
            const linkClass = link.isCtu ? 'quest-action-btn ctu' : 'quest-action-btn';
            linksHTML += `<a href="${link.url}" target="_blank" class="${linkClass}">${link.text}</a>`;
          });
          linksHTML += '</div>';
        }

        html += `<div class="quest-item">`;
        html += `<div class="quest-content">`;
        html += `<span class="quest-name">${item.name}</span>`;
        if (item.subtext) html += `<span class="quest-sub-text">${item.subtext}</span>`;
        if (item.description) html += `<p class="quest-description">${item.description}</p>`;
        html += linksHTML;

        if (item.subparagraphs && item.subparagraphs.length > 0) {
          html += '<div class="quest-subparagraphs">';
          item.subparagraphs.forEach((sub) => {
            let subLinksHTML = '';
            if (sub.links && sub.links.length > 0) {
              subLinksHTML = '<div class="quest-links">';
              sub.links.forEach(link => {
                const linkClass = link.isCtu ? 'quest-action-btn ctu' : 'quest-action-btn';
                subLinksHTML += `<a href="${link.url}" target="_blank" class="${linkClass}">${link.text}</a>`;
              });
              subLinksHTML += '</div>';
            }

            html += `<div class="quest-subitem">`;
            html += `<span class="quest-subname">${sub.name}</span>`;
            if (sub.subtext) html += `<span class="quest-sub-text">${sub.subtext}</span>`;
            if (sub.description) html += `<p class="quest-description">${sub.description}</p>`;
            html += subLinksHTML;

            if (sub.newsCard) {
              html += `<a href="${sub.newsCard.url}" target="_blank" class="news-card">`;
              html += `<div class="news-card-image" style="background-image: url('${sub.newsCard.image}')"></div>`;
              html += `<div class="news-card-body">`;
              html += `<span class="news-card-source">${sub.newsCard.source}</span>`;
              html += `<span class="news-card-title">${sub.newsCard.title}</span>`;
              html += `</div>`;
              html += `</a>`;
            }

            html += `</div>`;
          });
          html += '</div>';
        }

        html += `</div>`;
        html += `</div>`;
      });

      html += '</div>';
      return html;
    }

    function toggleDropdown(category, button) {
      const dropdown = document.getElementById(`dropdown-${category}`);
      const content = document.getElementById(`dropdown-${category}-content`);

      // Close other dropdowns
      if (activeDropdown && activeDropdown !== dropdown) {
        activeDropdown.classList.remove('active');
        if (activeButton) {
          activeButton.classList.remove('active');
        }
      }

      // Toggle current dropdown
      if (dropdown.classList.contains('active')) {
        dropdown.classList.remove('active');
        button.classList.remove('active');
        activeDropdown = null;
        activeButton = null;
      } else {
        if (!content.innerHTML) {
          content.innerHTML = renderQuestContent(category);
        }

        dropdown.classList.add('active');
        button.classList.add('active');

        activeDropdown = dropdown;
        activeButton = button;
      }
    }

    function closeActiveDropdown() {
      if (activeDropdown) {
        activeDropdown.classList.remove('active');
        if (activeButton) {
          activeButton.classList.remove('active');
        }
        activeDropdown = null;
        activeButton = null;
      }
    }

    document.addEventListener('click', (e) => {
      if (activeDropdown && !e.target.closest('.quest-dropdown') && !e.target.closest('.subpage-link')) {
        closeActiveDropdown();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && activeDropdown) {
        closeActiveDropdown();
      }
    });
