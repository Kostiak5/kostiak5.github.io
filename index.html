<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 0 20px;
    }

    .name {
      font-size: clamp(3rem, 12vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 1.5rem;
      font-size: clamp(0.9rem, 2vw, 1.25rem);
      font-weight: 300;
      color: #888888;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .links {
      margin-top: 3rem;
      display: flex;
      gap: 2rem;
    }

    .links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
      letter-spacing: 0.05em;
      opacity: 0.6;
      transition: opacity 0.2s ease;
    }

    .links a:hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <h1 class="name">constantin kolomiiets</h1>

  <div class="links">
    <a href="https://github.com/Kostiak5" target="_blank">github</a>
    <a href="www.linkedin.com/in/constantin-kolomiiets-44b2aa216" target="_blank">linkedin</a>
    <a href="mailto:conskol5@gmail.com">gmail</a>
  </div>

</body>
</html>
