<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-transform: lowercase;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .back-link {
      display: inline-block;
      color: #888888;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #ffffff;
    }

    .content {
      max-width: 600px;
      text-align: center;
      line-height: 1.6;
    }

    p {
      color: #aaaaaa;
      margin-bottom: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>world</h1>
    <a href="index.html" class="back-link">← back to home</a>
  </div>

  <div class="content">
    <p>a placeholder page for the world section.</p>
    <p>explore, discover, and connect with the world around you.</p>
  </div>

</body>
</html>
