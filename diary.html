<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diary</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      text-transform: lowercase;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    .back-link {
      display: inline-block;
      color: #888888;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      transition: color 0.2s ease;
    }

    .back-link:hover {
      color: #ffffff;
    }

    .photo-container {
      max-width: 700px;
      width: 100%;
      margin: 0 auto;
    }

    .diary-photo {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #1a1a1a;
      border-radius: 2px;
    }

    .empty-state {
      color: #666666;
      font-size: 1rem;
      text-align: center;
      padding: 3rem 0;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>diary</h1>
    <a href="index.html" class="back-link">← back to home</a>
  </div>

  <div class="photo-container" id="photoContainer">
    <p class="empty-state">no entries yet</p>
  </div>

  <script src="images/diary/current.js" onerror="window.DIARY_PHOTO = undefined;"></script>
  <script>
    const container = document.getElementById('photoContainer');
    if (typeof DIARY_PHOTO !== 'undefined' && DIARY_PHOTO) {
      container.innerHTML = `<img src="${DIARY_PHOTO}" alt="latest diary photo" class="diary-photo">`;
    }
  </script>

</body>
</html>
